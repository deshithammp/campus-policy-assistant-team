<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Policy Assistant</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="bar-inner">
            <div class="brand"><span class="brand-mark" aria-hidden="true">CP</span><strong>Campus Policy Assistant</strong></div>
            <div class="mode"><a href="/admin" class="top-link">Admin</a><label for="mode">Mode</label><select id="mode" disabled>
                <option value="offline">Offline</option><option value="ollama">Ollama</option>
            </select></div>
        </div>
    </header>
    <main class="layout" id="layout">
        <div class="workspace">
            <section class="intro" aria-labelledby="title">
                <p class="collection" id="collection">Loading policy documents</p>
                <h1 id="title">Find an answer in<br class="desktop-break"> campus policy.</h1>
                <p class="intro-text">Ask about the policies in this collection. Every supported answer shows the PDF page it came from.</p>
                <div class="examples" id="examples" aria-label="Example questions"></div>
            </section>
            <form id="question-form" class="composer">
                <label for="question">Ask a policy question</label>
                <div class="input-row">
                    <textarea id="question" name="question" rows="2" maxlength="1000" placeholder="Type your question here…" required></textarea>
                    <button class="primary" id="submit" type="submit" disabled>Ask <span aria-hidden="true">↑</span></button>
                </div>
            </form>
            <p class="status" id="status" role="status"></p>
            <section id="conversation" class="conversation" aria-label="Questions and answers"></section>
            <details class="library">
                <summary>Documents in this collection</summary>
                <ul id="documents"></ul>
            </details>
        </div>
        <section class="source-panel" id="source-panel" aria-labelledby="source-title" tabindex="-1" hidden>
            <div class="source-heading">
                <div><p class="eyebrow">Source evidence</p><h2 id="source-title"></h2></div>
                <button id="close-source" type="button" class="close" aria-label="Close source evidence">×</button>
            </div>
            <p class="source-page" id="source-page"></p>
            <blockquote id="quote"></blockquote>
            <div class="source-actions">
                <a id="open-page" target="_blank" rel="noopener">Open cited page ↗</a>
                <a id="open-document" target="_blank" rel="noopener">Full PDF ↗</a>
            </div>
            <iframe id="pdf" title="Cited PDF page" hidden></iframe>
        </section>
    </main>
</body>
</html>
